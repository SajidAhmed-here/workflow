name: codestyle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codestyle:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The pinned 2020 style tools need an older Python runtime.
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements/requirements-dev.txt
            .github/workflows/codestyle.yml

      - name: Install codestyle dependencies
        # Match requirements-dev.txt without installing unrelated ML/docs packages.
        # Old Black needs Click's _unicodefun; old flake8 needs pkg_resources.
        # Pin pydocstyle to the API expected by flake8-docstrings 1.5.0.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'catalyst-codestyle==20.04' \
            'click==8.0.4' \
            'pydocstyle==5.1.1' \
            'setuptools==80.9.0'
          python -m pip check

      - name: Check codestyle
        run: catalyst-check-codestyle
